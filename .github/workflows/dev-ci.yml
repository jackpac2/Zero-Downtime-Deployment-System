name: Dev CI

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  FRONTEND_IMAGE: ghcr.io/jackpac2/zero-downtime-frontend
  BACKEND_IMAGE: ghcr.io/jackpac2/zero-downtime-backend
  NOTIFIER_IMAGE: ghcr.io/jackpac2/zero-downtime-notifier
  PROD_COMPOSE_FILE: compose/docker-compose.prod.yml
  PROD_COMPOSE_PROJECT: zero-downtime
  VALIDATION_IMAGE_TAG: "0000000000000000000000000000000000000000"

jobs:
  validate-dev:
    name: Validate Dev Branch
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare image metadata
        id: vars
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            notifier/package-lock.json

      - name: Validate frontend
        id: frontend_validation
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build

      - name: Validate backend
        id: backend_validation
        working-directory: backend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run check --if-present

      - name: Validate notifier
        id: notifier_validation
        working-directory: notifier
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          node --check src/server.js

      - name: Validate production Compose config
        id: compose_validation
        run: IMAGE_TAG="$VALIDATION_IMAGE_TAG" DISCORD_WEBHOOK_URL="" docker compose -p "$PROD_COMPOSE_PROJECT" -f "$PROD_COMPOSE_FILE" config

      - name: Validate prepared router and application Compose configs
        run: |
          IMAGE_TAG="$VALIDATION_IMAGE_TAG" DISCORD_WEBHOOK_URL="" docker compose -p zero-downtime-app -f compose/docker-compose.app.yml config
          IMAGE_TAG="$VALIDATION_IMAGE_TAG" DISCORD_WEBHOOK_URL="" docker compose -p zero-downtime-router -f compose/docker-compose.router.yml config

      - name: Validate prepared router topology
        run: bash scripts/tests/test-router-topology.sh

      - name: Validate prepared router Nginx config
        run: docker run --rm --volume "$PWD/nginx/router.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Validate deployment safety helpers
        run: bash scripts/tests/test-deployment-common.sh

      - name: Validate deployment shell syntax
        id: shell_syntax_validation
        run: |
          bash -n scripts/migrate-to-stable-router.sh
          bash -n scripts/lib/*.sh
          bash -n scripts/tests/*.sh

      - name: Test stable router migration
        id: migration_test
        run: bash scripts/tests/test-stable-router-migration.sh

      - name: Validate Git diff formatting
        id: diff_check
        run: git diff --check HEAD^ HEAD

      - name: Validate Docker image builds
        id: docker_build_validation
        run: |
          docker build -t "${FRONTEND_IMAGE}:${{ steps.vars.outputs.sha }}" ./frontend
          docker build -t "${BACKEND_IMAGE}:${{ steps.vars.outputs.sha }}" ./backend
          docker build -t "${NOTIFIER_IMAGE}:${{ steps.vars.outputs.sha }}" ./notifier

      - name: Write dev validation summary
        if: always()
        run: |
          {
            echo "## Dev CI Summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Git SHA | ${{ steps.vars.outputs.sha }} |"
            echo "| Short SHA | ${{ steps.vars.outputs.short_sha }} |"
            echo "| Branch name | ${{ github.ref_name }} |"
            echo "| Frontend validation status | ${{ steps.frontend_validation.outcome }} |"
            echo "| Backend validation status | ${{ steps.backend_validation.outcome }} |"
            echo "| Notifier validation status | ${{ steps.notifier_validation.outcome }} |"
            echo "| Compose validation status | ${{ steps.compose_validation.outcome }} |"
            echo "| Shell syntax validation status | ${{ steps.shell_syntax_validation.outcome }} |"
            echo "| Migration test status | ${{ steps.migration_test.outcome }} |"
            echo "| Diff check status | ${{ steps.diff_check.outcome }} |"
            echo "| Docker build validation status | ${{ steps.docker_build_validation.outcome }} |"
            echo "| Deployment performed | No |"
          } >> "$GITHUB_STEP_SUMMARY"
