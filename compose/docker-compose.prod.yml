services:
  nginx:
    image: nginx:1.27-alpine
    container_name: zero-downtime-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    image: ghcr.io/jackpac2/zero-downtime-frontend:${IMAGE_TAG}
    container_name: zero-downtime-frontend
    expose:
      - "80"
    restart: unless-stopped

  backend:
    image: ghcr.io/jackpac2/zero-downtime-backend:${IMAGE_TAG}
    container_name: zero-downtime-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost
    expose:
      - "3001"
    restart: unless-stopped
