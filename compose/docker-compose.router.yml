services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/router.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - router
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/router-health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  notifier:
    image: ghcr.io/jackpac2/zero-downtime-notifier:${IMAGE_TAG}
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:9001:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://localhost:4000/health', res => process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  default:
  router:
    name: zero-downtime-router
    external: true
