name: Build and Deploy

on:
  push:
    branches:
      - Main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/jackpac2/zero-downtime-frontend
  BACKEND_IMAGE: ghcr.io/jackpac2/zero-downtime-backend
  NOTIFIER_IMAGE: ghcr.io/jackpac2/zero-downtime-notifier
  PROD_COMPOSE_FILE: compose/docker-compose.prod.yml
  PROD_COMPOSE_PROJECT: zero-downtime
  VALIDATION_IMAGE_TAG: "0000000000000000000000000000000000000000"

jobs:
  build-and-deploy:
    name: Validate, Build, Push, and Manually Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate stable router migration shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n scripts/lib/*.sh
          bash -n scripts/tests/*.sh

      - name: Test EC2 bootstrap workflow safety
        run: bash scripts/tests/test-ec2-bootstrap.sh

      - name: Test stable router migration
        run: bash scripts/tests/test-stable-router-migration.sh

      - name: Validate Git diff formatting
        run: git diff --check HEAD^ HEAD

      - name: Prepare image metadata
        id: vars
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            notifier/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run check --if-present

      - name: Validate notifier
        working-directory: notifier
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          node --check src/server.js

      - name: Validate production Compose config
        run: IMAGE_TAG="$VALIDATION_IMAGE_TAG" DISCORD_WEBHOOK_URL="" docker compose -p "$PROD_COMPOSE_PROJECT" -f "$PROD_COMPOSE_FILE" config

      - name: Validate prepared router and application Compose configs
        run: |
          IMAGE_TAG="$VALIDATION_IMAGE_TAG" DISCORD_WEBHOOK_URL="" docker compose -p zero-downtime-app -f compose/docker-compose.app-legacy.yml config
          DEPLOY_COLOR=blue IMAGE_TAG="$VALIDATION_IMAGE_TAG" docker compose -p zero-downtime-blue -f compose/docker-compose.app.yml config
          DEPLOY_COLOR=green IMAGE_TAG="$VALIDATION_IMAGE_TAG" docker compose -p zero-downtime-green -f compose/docker-compose.app.yml config
          IMAGE_TAG="$VALIDATION_IMAGE_TAG" DISCORD_WEBHOOK_URL="" docker compose -p zero-downtime-router -f compose/docker-compose.router.yml config

      - name: Validate prepared router topology
        run: bash scripts/tests/test-router-topology.sh

      - name: Validate prepared router Nginx config
        run: docker run --rm --volume "$PWD/nginx/router.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Validate deployment safety helpers
        run: bash scripts/tests/test-deployment-common.sh

      - name: Test controlled Blue/Green activation and rollback
        run: |
          bash scripts/tests/test-blue-green-preparation.sh
          bash scripts/tests/test-router-rendering.sh
          bash scripts/tests/test-router-switch.sh
          bash scripts/tests/test-blue-green-activation.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
            org.opencontainers.image.created=${{ steps.vars.outputs.created }}
            org.opencontainers.image.title=zero-downtime-frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
            org.opencontainers.image.created=${{ steps.vars.outputs.created }}
            org.opencontainers.image.title=zero-downtime-backend

      - name: Build and push notifier image
        uses: docker/build-push-action@v6
        with:
          context: ./notifier
          push: true
          tags: |
            ${{ env.NOTIFIER_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.NOTIFIER_IMAGE }}:${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
            org.opencontainers.image.created=${{ steps.vars.outputs.created }}
            org.opencontainers.image.title=zero-downtime-notifier

      - name: Resolve deployment context
        id: deployment_context
        env:
          CONFIGURED_EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          app_dir="${CONFIGURED_EC2_APP_DIR:-/home/ubuntu/Zero-Downtime-Deployment-System}"
          if [[ "$app_dir" != /* ]] || [ "$app_dir" = / ] || [[ "$app_dir" == *$'\n'* ]] || [[ "$app_dir" == *$'\r'* ]]; then
            echo "EC2_APP_DIR must be a non-root absolute path on one line." >&2
            exit 1
          fi
          printf 'Resolved EC2 application directory: %s\n' "$app_dir"
          echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"

      - name: Confirm manual production activation guard
        if: github.event_name == 'push'
        run: echo "Push-to-Main does not mutate EC2. Images were built and published; use manual workflow dispatch for controlled production activation."

      - name: Require Main for manual deployment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/Main'
        run: |
          echo "The stable-router deployment must be dispatched from the Main branch." >&2
          exit 1

      - name: Validate AWS deployment configuration
        id: aws_deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN_VALUE: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID_VALUE: ${{ vars.EC2_INSTANCE_ID }}
          CONFIGURED_DEPLOY_USER: ${{ vars.EC2_DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${AWS_ROLE_ARN_VALUE:?AWS_ROLE_ARN repository variable is required}"
          : "${EC2_INSTANCE_ID_VALUE:?EC2_INSTANCE_ID repository variable is required}"
          [ "$AWS_REGION_VALUE" = us-east-1 ] || {
            echo "AWS_REGION must be us-east-1; found ${AWS_REGION_VALUE:-empty}." >&2
            exit 1
          }
          [[ "$AWS_ROLE_ARN_VALUE" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]] || {
            echo "AWS_ROLE_ARN is not a valid IAM role ARN." >&2
            exit 1
          }
          [[ "$EC2_INSTANCE_ID_VALUE" =~ ^i-[0-9a-fA-F]{8}([0-9a-fA-F]{9})?$ ]] || {
            echo "EC2_INSTANCE_ID is invalid." >&2
            exit 1
          }
          deploy_user="${CONFIGURED_DEPLOY_USER:-ubuntu}"
          [[ "$deploy_user" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo "EC2_DEPLOY_USER is invalid." >&2
            exit 1
          }
          echo "deployment_user=$deploy_user" >> "$GITHUB_OUTPUT"
          echo "Deployment user: $deploy_user"
          echo "SSM target: $EC2_INSTANCE_ID_VALUE"
          echo "AWS region: $AWS_REGION_VALUE"

      - name: Configure AWS credentials
        id: aws_credentials
        if: github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve EC2 public IPv4 address
        id: ec2_address
        if: github.event_name == 'workflow_dispatch'
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if ! instance_details=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION_VALUE" \
            --query 'Reservations[0].Instances[0].{State:State.Name,PublicIp:PublicIpAddress}' \
            --output json); then
            echo "EC2 instance ${EC2_INSTANCE_ID} does not exist or could not be described in ${AWS_REGION_VALUE}." >&2
            echo "Confirm the instance ID, region, and ec2:DescribeInstances permission." >&2
            exit 1
          fi

          instance_state=$(jq -r '.State // empty' <<< "$instance_details")
          EC2_HOST=$(jq -r '.PublicIp // empty' <<< "$instance_details")

          case "$instance_state" in
            ""|None|null)
              echo "EC2 instance ${EC2_INSTANCE_ID} does not exist in ${AWS_REGION_VALUE}." >&2
              exit 1
              ;;
          esac
          if [ "$instance_state" != running ]; then
            echo "EC2 instance ${EC2_INSTANCE_ID} must be running; found state ${instance_state}." >&2
            exit 1
          fi
          case "$EC2_HOST" in
            ""|None|null)
              echo "Running EC2 instance ${EC2_INSTANCE_ID} has no public IPv4 address." >&2
              exit 1
              ;;
          esac
          [[ "$EC2_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
            echo "EC2 instance ${EC2_INSTANCE_ID} returned an invalid public IPv4 address." >&2
            exit 1
          }

          echo "::add-mask::$EC2_HOST"
          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"
          echo "Resolved the public IPv4 address for running EC2 instance ${EC2_INSTANCE_ID}."

      - name: Store transient deployment secrets
        id: ssm_secrets
        if: github.event_name == 'workflow_dispatch'
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          parameter_prefix="/zero-downtime-deployment/github-actions/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          username_parameter=""
          token_parameter=""
          webhook_parameter=""
          [ -z "$GHCR_USERNAME" ] || username_parameter="${parameter_prefix}/ghcr-username"
          [ -z "$GHCR_TOKEN" ] || token_parameter="${parameter_prefix}/ghcr-token"
          [ -z "$DISCORD_WEBHOOK_URL" ] || webhook_parameter="${parameter_prefix}/discord-webhook"

          echo "username_parameter=$username_parameter" >> "$GITHUB_OUTPUT"
          echo "token_parameter=$token_parameter" >> "$GITHUB_OUTPUT"
          echo "webhook_parameter=$webhook_parameter" >> "$GITHUB_OUTPUT"

          secret_dir="$(mktemp -d)"
          cleanup_secret_files() { rm -rf -- "$secret_dir"; }
          trap cleanup_secret_files EXIT
          chmod 0700 "$secret_dir"

          put_secure_parameter() {
            local name="$1" value="$2" label="$3"
            local value_file="$secret_dir/${label}.value"
            local request_file="$secret_dir/${label}.json"
            [ -n "$name" ] || return 0
            printf '%s' "$value" > "$value_file"
            chmod 0600 "$value_file"
            jq -n \
              --arg name "$name" \
              --rawfile value "$value_file" \
              '{Name: $name, Value: $value, Type: "SecureString", Overwrite: true}' \
              > "$request_file"
            chmod 0600 "$request_file"
            aws ssm put-parameter --cli-input-json "file://${request_file}" >/dev/null
          }

          put_secure_parameter "$username_parameter" "$GHCR_USERNAME" username
          put_secure_parameter "$token_parameter" "$GHCR_TOKEN" token
          put_secure_parameter "$webhook_parameter" "$DISCORD_WEBHOOK_URL" webhook

      - name: Install EC2 prerequisites
        id: prerequisites
        if: github.event_name == 'workflow_dispatch'
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ steps.aws_deployment.outputs.deployment_user }}
        run: |
          set -euo pipefail
          bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Install EC2 deployment prerequisites" \
            --user "$DEPLOY_USER" \
            --script scripts/bootstrap-ec2-host.sh

      # This is a separate SSM process so new docker-group membership is active.
      - name: Verify Docker without sudo after reconnect
        id: docker_access
        if: github.event_name == 'workflow_dispatch'
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ steps.aws_deployment.outputs.deployment_user }}
        run: |
          set -euo pipefail
          verification_script="$(mktemp)"
          trap 'rm -f -- "$verification_script"' EXIT
          printf '%s\n' \
            'set -euo pipefail' \
            'docker info >/dev/null' \
            'docker compose version' \
            > "$verification_script"
          bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Verify deployment-user Docker access" \
            --user "$DEPLOY_USER" \
            --script "$verification_script"

      - name: Prepare exact EC2 repository commit
        id: repository
        if: github.event_name == 'workflow_dispatch'
        env:
          APP_DIR: ${{ steps.deployment_context.outputs.app_dir }}
          DEPLOY_SHA: ${{ steps.vars.outputs.sha }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ steps.aws_deployment.outputs.deployment_user }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          directory_script="$(mktemp)"
          exact_commit_script="$(mktemp)"
          cleanup_repository_scripts() { rm -f -- "$directory_script" "$exact_commit_script"; }
          trap cleanup_repository_scripts EXIT

          cat > "$directory_script" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          if [ ! -e "$app_dir" ]; then
            sudo install -d -o "$(id -un)" -g "$(id -gn)" "$app_dir"
          fi
          [ -d "$app_dir" ] || { echo "EC2 application path is not a directory: ${app_dir}" >&2; exit 1; }
          test "$(stat -c '%U' "$app_dir")" = "$(id -un)" || {
            echo "EC2 application directory is not owned by $(id -un): ${app_dir}" >&2
            exit 1
          }
          REMOTE

          bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Create and validate EC2 application directory" \
            --user "$DEPLOY_USER" \
            --script "$directory_script" \
            -- "$APP_DIR"

          bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Initialize EC2 deployment repository" \
            --user "$DEPLOY_USER" \
            --script scripts/ensure-ec2-repo.sh \
            -- "$APP_DIR" "$REPOSITORY_URL" Main

          {
            cat scripts/lib/deployment-common.sh
            cat <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          deploy_sha="$2"
          validate_deployment_sha "$deploy_sha" "Workflow deployment SHA"
          ensure_deployment_state_dir "$app_dir/.deploy"
          acquire_deployment_lock "$app_dir/.deploy"
          prepare_exact_deployment_commit "$app_dir" "$deploy_sha" Main
          verify_exact_deployment_commit "$app_dir" "$deploy_sha" Main
          test "$(git -C "$app_dir" rev-parse HEAD)" = "${deploy_sha,,}"
          test "$(stat -c '%U' "$app_dir")" = "$(id -un)"
          test -x "$app_dir/scripts/deploy.sh"
          test -f "$app_dir/scripts/migrate-to-stable-router.sh"
          test -f "$app_dir/scripts/stable-router-deployment-coordinator.sh"
          test -x "$app_dir/scripts/deploy-blue-green.sh"
          test -x "$app_dir/scripts/rollback-blue-green.sh"
          test -x "$app_dir/scripts/render-router-config.sh"
          test -f "$app_dir/scripts/ssm-execute-deployment.sh"
          REMOTE
          } > "$exact_commit_script"

          bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Prepare exact EC2 deployment commit" \
            --user "$DEPLOY_USER" \
            --script "$exact_commit_script" \
            -- "$APP_DIR" "$DEPLOY_SHA"

      - name: Inspect topology marker
        id: topology
        if: github.event_name == 'workflow_dispatch'
        env:
          APP_DIR: ${{ steps.deployment_context.outputs.app_dir }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ steps.aws_deployment.outputs.deployment_user }}
        run: |
          set -euo pipefail
          topology_script="$(mktemp)"
          trap 'rm -f -- "$topology_script"' EXIT
          cat > "$topology_script" <<'REMOTE'
          set -euo pipefail
          topology_file="$1/.deploy/topology"
          if [ ! -e "$topology_file" ]; then
            echo absent
            exit 0
          fi
          if [ ! -f "$topology_file" ]; then
            echo invalid
            echo "Topology marker is not a regular file: ${topology_file}" >&2
            exit 1
          fi
          topology="$(tr -d '[:space:]' < "$topology_file")"
          if [ "$topology" = stable-router ]; then
            echo stable-router
            exit 0
          fi
          echo invalid
          echo "Unknown topology marker value: ${topology:-empty}" >&2
          exit 1
          REMOTE
          set +e
          starting_topology=$(bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Inspect deployment topology" \
            --user "$DEPLOY_USER" \
            --script "$topology_script" \
            -- "$APP_DIR")
          topology_status=$?
          set -e
          echo "starting_topology=$starting_topology" >> "$GITHUB_OUTPUT"
          echo "Starting topology: $starting_topology"
          exit "$topology_status"

      - name: Deploy through stable-router Blue/Green coordinator
        id: migration
        if: github.event_name == 'workflow_dispatch'
        env:
          APP_DIR: ${{ steps.deployment_context.outputs.app_dir }}
          DEPLOY_SHA: ${{ steps.vars.outputs.sha }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ steps.aws_deployment.outputs.deployment_user }}
          GHCR_USERNAME_PARAMETER: ${{ steps.ssm_secrets.outputs.username_parameter }}
          GHCR_TOKEN_PARAMETER: ${{ steps.ssm_secrets.outputs.token_parameter }}
          DISCORD_WEBHOOK_PARAMETER: ${{ steps.ssm_secrets.outputs.webhook_parameter }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Resolved EC2 public IPv4 address is unavailable}"
          invocation_script="$(mktemp)"
          trap 'rm -f -- "$invocation_script"' EXIT
          cat > "$invocation_script" <<'REMOTE'
          set -euo pipefail
          exec bash "$2/scripts/ssm-execute-deployment.sh" "$@" "$2/scripts/stable-router-deployment-coordinator.sh"
          REMOTE
          bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Deploy and verify stable-router Blue/Green topology" \
            --root \
            --script "$invocation_script" \
            -- "$DEPLOY_USER" "$APP_DIR" "$DEPLOY_SHA" "$EC2_HOST" "$AWS_REGION_VALUE" \
               "$GHCR_USERNAME_PARAMETER" "$GHCR_TOKEN_PARAMETER" "$DISCORD_WEBHOOK_PARAMETER"

      - name: Collect safe failure diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && steps.docker_access.outcome == 'success'
        env:
          APP_DIR: ${{ steps.deployment_context.outputs.app_dir }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ steps.aws_deployment.outputs.deployment_user }}
        run: |
          set -euo pipefail
          diagnostics_script="$(mktemp)"
          trap 'rm -f -- "$diagnostics_script"' EXIT
          cat > "$diagnostics_script" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          for project_file in \
            'zero-downtime compose/docker-compose.prod.yml' \
            'zero-downtime-app compose/docker-compose.app-legacy.yml' \
            'zero-downtime-router compose/docker-compose.router.yml' \
            'zero-downtime-blue compose/docker-compose.app.yml' \
            'zero-downtime-green compose/docker-compose.app.yml'; do
            set -- $project_file
            docker compose -p "$1" -f "$2" ps || true
          done
          if [ -f .deploy/topology ]; then
            printf 'Topology marker: '
            tr -d '[:space:]' < .deploy/topology
            echo
          fi
          for state in active-color candidate-color current.sha previous.sha blue.sha green.sha; do
            if [ -f ".deploy/$state" ]; then printf '%s: ' "$state"; tr -d '[:space:]' < ".deploy/$state"; echo; fi
          done
          REMOTE
          bash scripts/run-ssm-command.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --comment "Collect deployment failure diagnostics" \
            --user "$DEPLOY_USER" \
            --script "$diagnostics_script" \
            -- "$APP_DIR"

      - name: Remove transient deployment secrets
        if: always() && github.event_name == 'workflow_dispatch' && steps.aws_credentials.outcome == 'success'
        env:
          GHCR_USERNAME_PARAMETER: ${{ steps.ssm_secrets.outputs.username_parameter }}
          GHCR_TOKEN_PARAMETER: ${{ steps.ssm_secrets.outputs.token_parameter }}
          DISCORD_WEBHOOK_PARAMETER: ${{ steps.ssm_secrets.outputs.webhook_parameter }}
        run: |
          set -euo pipefail
          for parameter_name in \
            "$GHCR_USERNAME_PARAMETER" \
            "$GHCR_TOKEN_PARAMETER" \
            "$DISCORD_WEBHOOK_PARAMETER"; do
            [ -z "$parameter_name" ] || aws ssm delete-parameter --name "$parameter_name" >/dev/null
          done

      - name: Write workflow summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_DIR: ${{ steps.deployment_context.outputs.app_dir }}
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker_access.outcome }}
          STARTING_TOPOLOGY: ${{ steps.topology.outputs.starting_topology }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
        run: |
          set -euo pipefail
          status_value() {
            case "$1" in
              success) echo Passed ;;
              failure) echo Failed ;;
              *) echo Skipped ;;
            esac
          }
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            bootstrap_requested=Yes
          else
            bootstrap_requested=No
          fi
          starting_topology="${STARTING_TOPOLOGY:-absent}"
          if [ "$bootstrap_requested" = No ]; then
            legacy_status=Skipped
            migration_status=Skipped
          elif [ "$MIGRATION_OUTCOME" = success ] && [ "$starting_topology" = absent ]; then
            legacy_status=Ran
            migration_status=Ran
          elif [ "$MIGRATION_OUTCOME" = success ] && [ "$starting_topology" = stable-router ]; then
            legacy_status=Skipped
            migration_status=Skipped
          else
            legacy_status=Failed
            migration_status=Failed
          fi
          health_status="$(status_value "$MIGRATION_OUTCOME")"
          {
            echo "## Production Workflow Summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Event type | ${EVENT_NAME} |"
            echo "| Deployment SHA | ${{ steps.vars.outputs.sha }} |"
            echo "| EC2 directory | ${APP_DIR:-/home/ubuntu/Zero-Downtime-Deployment-System} |"
            echo "| Bootstrap requested | ${bootstrap_requested} |"
            echo "| Prerequisites | $(status_value "$PREREQUISITES_OUTCOME") |"
            echo "| Docker without sudo | $(status_value "$DOCKER_OUTCOME") |"
            echo "| Starting topology | ${starting_topology} |"
            echo "| Legacy deployment | ${legacy_status} |"
            echo "| Migration | ${migration_status} |"
            echo "| Final topology | $([ "$MIGRATION_OUTCOME" = success ] && echo stable-router || echo 'Not verified') |"
            echo "| Router health | ${health_status} |"
            echo "| Frontend health | ${health_status} |"
            echo "| Backend health | ${health_status} |"
            echo "| Notifier health | ${health_status} |"
          } >> "$GITHUB_STEP_SUMMARY"

