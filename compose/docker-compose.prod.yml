services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    image: ghcr.io/jackpac2/zero-downtime-frontend:${IMAGE_TAG}
    expose:
      - "80"
    restart: unless-stopped

  backend:
    image: ghcr.io/jackpac2/zero-downtime-backend:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/health', res => process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  notifier:
    image: ghcr.io/jackpac2/zero-downtime-notifier:${IMAGE_TAG}
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - '127.0.0.1:9001:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://localhost:4000/health', res => process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
